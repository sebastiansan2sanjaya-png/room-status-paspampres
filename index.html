<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room Status — Rusun Paspampres 2026</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#appframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="appframe" title="Room Status"></iframe>
<script>
(async()=>{
 const frame=document.getElementById('appframe');
 const sourceUrl='https://raw.githubusercontent.com/sebastiansan2sanjaya-png/room-status-paspampres/b265e244dbfabcb435a3c483602bae04c8ddf42a/index.html';
 const baseUrl='https://sebastiansan2sanjaya-png.github.io/room-status-paspampres/';
 const roleUrl=baseUrl+'role-workflow.js?v=20260827-5';
 try{
  const r=await fetch(sourceUrl,{cache:'no-store'});
  if(!r.ok)throw new Error('Gagal memuat versi utama');
  let html=await r.text();
  html=html.replace(/<head>/i,'<head><base href="'+baseUrl+'">');
  html=html.replace('</body>',`<script src="${roleUrl}"></script></body>`);
  frame.srcdoc=html;
 }catch(e){
  frame.remove();
  const p=document.createElement('div');
  p.style.cssText='font-family:Arial;padding:24px';
  p.textContent='Gagal memuat Room Status: '+(e.message||e);
  document.body.appendChild(p);
  console.error(e);
 }
})();
</script>
</body>
</html>
