<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room Status — Rusun Paspampres 2026</title></head><body><div id="boot" style="font-family:Arial;padding:20px">Memuat Room Status…</div><script>
(async()=>{
 const url='https://raw.githubusercontent.com/sebastiansan2sanjaya-png/room-status-paspampres/126c7520322dd53a782ce1b93686bcca42fbbe0f/index.html';
 try{
  const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error('Gagal memuat versi utama');
  let html=await r.text();
  html=html.replace('id="updatedBy" class="meta-input" value="" placeholder="Nama PIC"','id="updatedBy" class="meta-input" value="" placeholder="Nama PIC" readonly aria-readonly="true" tabindex="-1"');
  const guard=`<script>(function(){function lockPic(){const el=document.getElementById('updatedBy');if(!el)return;el.readOnly=true;el.setAttribute('aria-readonly','true');el.setAttribute('tabindex','-1');}document.addEventListener('click',function(e){if(e.target&&e.target.id==='save')lockPic();},true);document.addEventListener('input',function(e){if(e.target&&e.target.id==='updatedBy')e.target.value=e.target.defaultValue||'';},true);setInterval(lockPic,500);})();<\/script>`;
  html=html.replace('<\/body>',guard+'<\/body>');
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('boot').textContent='Gagal memuat Room Status. Silakan refresh.';console.error(e)}
})();
</script><script src="occupancy-recap.js"></script>
</body></html>
