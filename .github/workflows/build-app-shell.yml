name: Build Room Status App Shell

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'role-workflow.js'
      - 'occupancy-recap.js'
      - '.github/workflows/build-app-shell.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: "${{ !contains(github.event.head_commit.message, 'Build app shell') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize app shell from known-good app source
        run: |
          git show b265e244dbfabcb435a3c483602bae04c8ddf42a:index.html > app.html
          python - <<'PY'
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')
          tag1 = '<script src="role-workflow.js?v=20260827-7"></script>'
          tag2 = '<script src="occupancy-recap.js?v=20260827-7"></script>'
          s = s.replace('</body>', tag1 + '\n' + tag2 + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit app shell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git diff --cached --quiet && exit 0
          git commit -m 'Build app shell'
          git push
