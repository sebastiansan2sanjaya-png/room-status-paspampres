name: Build Room Status App Shell

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.html'
      - 'role-workflow.js'
      - 'occupancy-recap.js'
      - '.github/workflows/build-app-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate app shell
        run: |
          test -s index.html
          test -s app.html
          echo "Room Status app shell validated."
