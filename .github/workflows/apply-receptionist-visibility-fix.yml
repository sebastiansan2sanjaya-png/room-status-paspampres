name: Correct room status role visibility
on:
  push:
    paths:
      - '.github/workflows/apply-receptionist-visibility-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore OS OO status visibility and patch HK detail access
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Resepsionis must still see OS/OO status cards, filters and counts.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(
              r"\nconst RECEPTIONIST_HIDDEN_STATUSES=\['OS','OO'\];.*?function visibleStatuses\(\)\{.*?\}\n",
              "\n",
              s,
              flags=re.S,
          )
          s = s.replace("visibleStatuses().forEach(([code,s])=>statusFilter.insertAdjacentHTML('beforeend',`<option value=\"${code}\">${code} — ${s.name}</option>`));",
                        "Object.entries(STATUS).forEach(([code,s])=>statusFilter.insertAdjacentHTML('beforeend',`<option value=\"${code}\">${code} — ${s.name}</option>`));")
          s = s.replace("visibleStatuses().map(([code,s])=>", "Object.entries(STATUS).map(([code,s])=>")
          s = s.replace("  const statusFilterText=(statusFilter.value==='ALL'||isRestrictedReceptionistStatus(statusFilter.value))?'Semua Status':`${statusFilter.value} — ${STATUS[statusFilter.value].name}`;",
                        "  const statusFilterText=statusFilter.value==='ALL'?'Semua Status':`${statusFilter.value} — ${STATUS[statusFilter.value].name}`;")
          s = s.replace("  const order=(isReceptionist()?['OD','VR','VC','VD']:['OD','VR','VC','VD','OS','OO']);",
                        "  const order=['OD','VR','VC','VD','OS','OO'];")

          # Restore the original unit sheet behavior. Permission filtering already
          # prevents Resepsionis from editing OS/OO; only HK condition details are restricted below.
          start = s.find('function openSheet(id){')
          end = s.find('function renderSheetStatus', start)
          if start >= 0 and end > start:
              original = '''function openSheet(id){
 const u=units.find(x=>x.id===id); if(!u)return;
 editingId=id;pendingStatus=u.status;
 document.getElementById('sheetTitle').textContent=`UNIT ${u.number}`;
 document.getElementById('sheetSub').textContent=`Tower ${u.tower.slice(1)} • Lantai ${u.floor}`;
 document.getElementById('lastUpdate').textContent=formatDate(u.updated);document.getElementById('updatedBy').value=u.updatedBy||'';
 renderSheetStatus(u);renderOptions();renderGuestSection(u);document.getElementById('overlay').classList.add('show');document.getElementById('sheet').style.display='block';
}
'''
              s = s[:start] + original + s[end:]
          p.write_text(s, encoding='utf-8')

          # 2) HK condition details: hidden from Resepsionis, available to
          # Supervisor HK and Housekeeping when the unit is OS/OO.
          p = Path('hk-inline-condition.js')
          h = p.read_text(encoding='utf-8')
          h = h.replace("async function viewDetail(){if(!R()&&!S())return;",
                        "async function viewDetail(){if(R()||(!S()&&!H()))return;")
          p.write_text(h, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hk-inline-condition.js
          git diff --cached --quiet && exit 0
          git commit -m 'Restore OS OO visibility and HK follow-up details'
          git push
