name: Fix guest save

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix guest save via RPC') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch guest save
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''    const {error:deleteError}=await supabaseClient
      .from('room_guests')
      .delete()
      .eq('unit_id',u.dbId);

    if(deleteError) throw deleteError;

    if(rows.length){
      const {error:insertError}=await supabaseClient
        .from('room_guests')
        .insert(rows);
      if(insertError) throw insertError;
    }
'''
          new = '''    const {data:saveCount,error:saveError}=await supabaseClient
      .rpc('save_room_guests',{
        p_unit_id:u.dbId,
        p_guests:rows
      });

    if(saveError) throw saveError;
'''
          if old not in s:
              raise SystemExit('Target guest-save block not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-guest-save.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-guest-save.yml
          git commit -m "Fix guest save via RPC"
          git push
