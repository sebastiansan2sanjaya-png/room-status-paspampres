name: Enforce room status role policy

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'role-workflow.js'

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify room status role workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('role-workflow.js')
          s = p.read_text(encoding='utf-8')

          required = [
              "['housekeeping','supervisor_hk','editor']",
              "p.role==='housekeeping'",
              "p.role==='supervisor_hk'",
              "report_room_condition",
              "validate_room_condition",
          ]

          for token in required:
              if token not in s:
                  raise SystemExit(f'Role workflow check failed: missing {token}')

          index = Path('index.html').read_text(encoding='utf-8')
          if 'ROLE_PERMISSIONS' in index:
              print('ROLE_PERMISSIONS found in index.html; continuing because index is a loader in the current architecture.')

          print('Room status role workflow verified.')
          PY
