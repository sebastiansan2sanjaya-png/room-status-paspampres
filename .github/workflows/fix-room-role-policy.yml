name: Enforce room status role policy

on:
  push:
    branches: [main]
    paths:
      - 'index.html'

permissions:
  contents: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify room status role policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          m = re.search(r"const ROLE_PERMISSIONS\s*=\s*\{([\s\S]*?)\};", s)
          if not m:
              raise SystemExit('ROLE_PERMISSIONS block not found.')

          block = m.group(0)
          expected = {
              'receptionist': ['OD'],
              'supervisor_hk': ['VC', 'VR', 'OS', 'OO'],
          }

          for role, statuses in expected.items():
              hit = re.search(rf"{role}\s*:\s*\[([^\]]*)\]", block)
              if not hit:
                  raise SystemExit(f'{role} permission entry not found.')
              actual = [x.strip().strip("'\"") for x in hit.group(1).split(',') if x.strip()]
              if actual != statuses:
                  raise SystemExit(f'{role} policy mismatch: {actual} != {statuses}')

          print('Room status role policy verified.')
          PY
